groups:
  - id: registry.moontel.example
    type: attribute_group
    brief: The attributes the example records.
    attributes:
      - id: service.name
        type: string
        stability: stable
        brief: The service that produced the telemetry.
        examples: [moontel-example]
      - id: gen_ai.provider.name
        type: string
        stability: stable
        brief: The GenAI provider.
        examples: [openai]
      - id: gen_ai.operation.name
        type: string
        stability: stable
        brief: The operation the client asked for.
        examples: [chat]
      - id: gen_ai.request.model
        type: string
        stability: stable
        brief: The model the client asked for.
        examples: [gpt-4o]
      - id: gen_ai.response.model
        type: string
        stability: stable
        brief: The model that answered.
        examples: [gpt-4o-2024-08-06]

  - id: metric.gen_ai.client.token.usage
    type: metric
    metric_name: gen_ai.client.token.usage
    stability: stable
    brief: Tokens used by the client.
    instrument: counter
    unit: "{token}"
    attributes:
      - ref: gen_ai.provider.name
      - ref: gen_ai.operation.name
      - ref: gen_ai.request.model

  - id: metric.gen_ai.client.operation.duration
    type: metric
    metric_name: gen_ai.client.operation.duration
    stability: stable
    brief: GenAI operation duration.
    instrument: histogram
    unit: s
    attributes:
      - ref: gen_ai.provider.name
      - ref: gen_ai.operation.name
      - ref: gen_ai.request.model
      - ref: gen_ai.response.model

  - id: metric.gen_ai.client.active.requests
    type: metric
    metric_name: gen_ai.client.active.requests
    stability: stable
    brief: Requests in flight.
    instrument: updowncounter
    unit: "{request}"
    attributes:
      - ref: gen_ai.provider.name
      - ref: gen_ai.operation.name
      - ref: gen_ai.request.model
      - ref: gen_ai.response.model

  - id: metric.gen_ai.client.queue.length
    type: metric
    metric_name: gen_ai.client.queue.length
    stability: stable
    brief: Requests waiting, as the queue reports them at collection time.
    instrument: gauge
    unit: "{request}"
    attributes:
      - ref: gen_ai.provider.name
      - ref: gen_ai.operation.name

  - id: metric.gen_ai.client.tokens.reported
    type: metric
    metric_name: gen_ai.client.tokens.reported
    stability: stable
    brief: Tokens the client has used, as the provider counts them. The program
      observes it at collection time, which a reader cannot see on the wire.
    instrument: counter
    unit: "{token}"
    attributes:
      - ref: gen_ai.provider.name
      - ref: gen_ai.operation.name
      - ref: gen_ai.request.model
      - ref: gen_ai.response.model

  - id: metric.gen_ai.client.workers.reported
    type: metric
    metric_name: gen_ai.client.workers.reported
    stability: stable
    brief: Workers the client keeps for the model.
    instrument: updowncounter
    unit: "{worker}"
    attributes:
      - ref: gen_ai.provider.name
      - ref: gen_ai.operation.name
      - ref: gen_ai.request.model
      - ref: gen_ai.response.model

  - id: metric.moontel.example.latency
    type: metric
    metric_name: moontel.example.latency
    stability: stable
    brief: Time a request took, at any scale.
    instrument: histogram
    unit: s
    attributes:
      - ref: gen_ai.provider.name
      - ref: gen_ai.operation.name
      - ref: gen_ai.request.model
      - ref: gen_ai.response.model
