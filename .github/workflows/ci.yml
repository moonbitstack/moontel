name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          for dir in src/examples/*/; do
            if grep -q 'kind: "executable"' "$dir/moon.pkg" && ! grep -q 'supported_targets' "$dir/moon.pkg"; then
              moon run "$dir" --target native > /dev/null
            fi
          done

      # The wrapper beside an annotated function is generated code, committed so that a
      # reader of the repository sees what the annotation means. This is what keeps it
      # the same code the generator would write today.
      - name: the generated span wrapper is what the generator writes
        if: runner.os == 'Linux'
        run: |
          moon run src/cmd/span --target native -- \
            src/examples/03-annotated/orders.mbt \
            -o src/examples/03-annotated/orders.g.mbt --check

      # The service that exports three signals needs a collector to talk to, which
      # the `otlp-collector` job supplies; here the compiler is what is checked.
      - name: the export example builds
        run: moon build src/examples/04-otlp --target native

      # The replay of the recorded reference run is generated from it, so the two
      # cannot drift: a change to the record without regenerating fails here.
      - name: generated code is up to date
        run: moon run src/cmd/span --target native -- -C src/examples/03-annotated orders.mbt -o orders.g.mbt --check

      - name: the replay of the recorded reference run is up to date
        if: runner.os == 'Linux'
        run: |
          python3 scripts/gen_trace_crosscheck.py
          git diff --exit-code src/crosscheck_expected_wbtest.mbt

      # The reference is generated from what `moon info` prints, so a public name
      # cannot be added to a package without appearing on the page.
      - name: the reference and the version are up to date
        if: runner.os == 'Linux'
        run: |
          python3 scripts/gen_api.py
          python3 scripts/gen_version.py
          git diff --exit-code docs/api.html docs/version.js

      # The semantic conventions come from a pinned commit of the upstream registry,
      # and the generator is what says so: a constant edited by hand fails here.
      - name: the semantic conventions are up to date
        if: runner.os == 'Linux'
        run: python3 scripts/gen_semconv.py --check

      # The OTLP messages are read out of the protocol's own schema. A field number
      # corrected in the generated file and not in the schema would be a correction
      # the next run throws away, so the two are compared here.
      - name: the OTLP messages are what the schema says
        if: runner.os == 'Linux'
        run: moon run src/cmd/gen-otlp-proto --target native -- --check

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            case "$dir" in *CHANGE-ME*) continue ;; esac
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      # A reader pastes the blocks of the README and the skills into a project, so
      # they have to compile as written, against this commit's source.
      - name: the code in the docs compiles
        if: runner.os == 'Linux'
        run: python3 scripts/check_snippets.py

  # The three signals, posted to a real collector and read back out of it. A request
  # the collector accepted and a payload it could parse are two different things, and
  # only the second one is worth reporting.
  otlp-collector:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: start the collector
        run: |
          docker run -d --name collector -p 4317:4317 -p 4318:4318 \
            -v "$PWD/.github/otel-collector.yaml:/etc/otelcol-contrib/config.yaml" \
            otel/opentelemetry-collector-contrib:0.164.0
          for i in $(seq 60); do
            if docker logs collector 2>&1 | grep -q "Everything is ready"; then
              exit 0
            fi
            sleep 1
          done
          docker logs collector
          exit 1

      - name: send the three signals
        run: moon run src/examples/04-otlp --target native -- http://localhost:4318

      # The same payload, gzipped: a server must take both, and a client that
      # compresses must say so.
      - name: send them again, compressed
        run: moon run src/examples/04-otlp --target native -- http://localhost:4318 gzip

      # And once in binary protobuf, which is the encoding the protocol treats as
      # the default and the one every exporter is required to be able to send.
      - name: send them once more, in protobuf
        run: moon run src/examples/04-otlp --target native -- http://localhost:4318 protobuf

      # A different transport entirely: one unary call on a channel, on the port the
      # protocol puts gRPC at. It sends the same three signals, so the log holds the
      # same items once more rather than a span on its own.
      - name: send the three signals over gRPC
        run: moon run src/examples/05-grpc --target native -- 127.0.0.1:4317

      # The meter's instruments, once, through the same exporter the other signals
      # use. Their names, units, attributes, data types and exemplars are read back
      # out of the collector below.
      - name: send the meter's instruments
        run: moon run src/examples/06-meter --target native -- http://localhost:4318

      - name: the collector parsed every signal
        run: |
          docker logs collector > collector.log 2>&1
          python3 - <<'EOF'
          import pathlib
          import sys

          text = pathlib.Path("collector.log").read_text(errors="replace")
          # What the collector prints only if it decoded the payload: a request it
          # accepted and a span it understood are two different things.
          required = [
              "Name           : GET /orders/42",
              "Kind           : Server",
              "Status code    : Ok",
              "Name: cache.miss",
              "Body: Str(order placed)",
              "SeverityNumber: Info(9)",
              "Name: orders_placed",
              "Name: order_latency",
              # The histogram's unit travelled in its own field, which is where it
              # belongs once the name no longer carries it.
              "Unit: s",
          ]
          missing = [want for want in required if want not in text]
          if missing:
              print("the collector did not report:", missing)
              sys.exit(1)
          # The bridge takes off the unit suffix the exposition appends, so the name
          # on the wire is the one the program registered.
          if "order_latency_seconds" in text:
              print("the exposition's unit suffix survived the bridge")
              sys.exit(1)
          # Four runs — plain, gzipped, protobuf and gRPC — of the same payload, so
          # an item is in the log four times only if every transport was decoded.
          # This is what "the same item on every protocol" means, and a count is how
          # it is compared: a signal that arrived on three of the four fails here.
          runs = 4
          for item in [
              "Name           : GET /orders/42",
              "Name: cache.miss",
              "Body: Str(order placed)",
              "Name: orders_placed",
              "Name: order_latency",
          ]:
              seen = text.count(item)
              if seen != runs:
                  print(f"{item!r} arrived {seen} times, expected {runs}")
                  sys.exit(1)
          # The four runs of the Prometheus-style latency, plus the meter's
          # duration histogram and its exponential latency, which are measured in
          # seconds as the GenAI conventions say.
          if text.count("Unit: s") != runs + 2:
              print(f"seconds arrived {text.count('Unit: s')} times, expected {runs + 2}")
              sys.exit(1)
          # One span and both records name a trace on every run.
          traces = text.count("Trace ID")
          if traces < runs * 3:
              print(f"expected the trace id on the span and both records per run, saw {traces}")
              sys.exit(1)
          # The meter's run: one metric per instrument, with the names the three
          # views left, the units the conventions spell, and the data type each
          # aggregation produces.
          for item, want in [
              ("-> Name: gen_ai.client.token.usage", 1),
              ("-> Name: gen_ai.client.operation.duration", 1),
              ("-> Name: gen_ai.client.active.requests", 1),
              # Renamed by a view, and with the two attributes that view kept.
              ("-> Name: gen_ai.client.queue.length", 1),
              ("-> Name: gen_ai.client.tokens.reported", 1),
              ("-> Name: gen_ai.client.workers.reported", 1),
              ("-> Name: moontel.example.latency", 1),
              # A dropped view leaves the instrument registered and nothing on the
              # wire, which is what makes a typo in a call site cheap to remove.
              ("-> Name: moontel.example.debug.tick", 0),
              ("DataType: Sum", 4),
              ("DataType: Histogram", 1),
              ("DataType: ExponentialHistogram", 1),
              ("DataType: Gauge", 1),
              ("-> Unit: {token}", 2),
              ("-> Unit: {request}", 2),
              ("-> Unit: {worker}", 1),
              ("-> IsMonotonic: false", 2),
              # Seven points and seven exemplars, each carrying the attributes of the
              # series it belongs to: the four attributes on five points, three on the
              # token counter after its view dropped one, two on the queue length.
              ("-> gen_ai.provider.name: Str(openai)", 14),
              ("-> gen_ai.operation.name: Str(chat)", 14),
              ("-> gen_ai.request.model: Str(gpt-4o)", 12),
              ("-> gen_ai.response.model: Str(gpt-4o-2024-08-06)", 10),
              ("Exemplar #0", 7),
              ("-> Trace ID: 4bf92f3577b34da6a3ce929d0e0e4736", 7),
              # The exponential histogram: the range it spans, and the bucket the
              # ten-millisecond measurement fell into at the scale it settled on.
              ("Min: 0.004000", 1),
              ("Max: 1.700000", 1),
              ("Bucket (0.010580, 0.011049], Count: 1", 1),
              # The default boundaries, one line each, and the bucket the 6-second
              # measurement fell into.
              ("Buckets #2, Count: 1", runs + 1),
          ]:
              seen = text.count(item)
              if seen != want:
                  print(f"{item!r} appeared {seen} times, expected {want}")
                  sys.exit(1)
          for index, bound in enumerate(
              [0, 5, 10, 25, 50, 75, 100, 250, 500, 750, 1000, 2500, 5000, 7500, 10000]
          ):
              item = f"ExplicitBounds #{index}: {bound:.6f}"
              if text.count(item) != 1:
                  print(f"{item!r} appeared {text.count(item)} times, expected 1")
                  sys.exit(1)
          print(
              "the collector parsed all three signals on every transport; "
              f"{traces} records name a trace; the meter's seven instruments, three "
              "views, seven exemplars and fifteen boundaries are accounted for",
          )
          EOF

  # The meter's seven metrics against the semantic conventions. First against a
  # registry in this repository, which describes exactly what the example emits, so
  # a name, a unit, an attribute or an instrument that drifts fails here. Then
  # against the GenAI registry upstream, which is the authority for the names the
  # example borrows.
  weaver:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      # The payload and the sample list are both derived from one run of the
      # example, so the live check reads what the meter really writes.
      - name: the meter's payload and the samples a live check reads
        run: |
          moon run src/examples/06-meter --target native -- dump > metrics.json
          python3 scripts/gen_weaver_samples.py metrics.json samples.json

      - name: install weaver
        run: |
          curl -fsSL -o weaver.tar.xz \
            https://github.com/open-telemetry/weaver/releases/download/v0.28.0/weaver-x86_64-unknown-linux-gnu.tar.xz
          tar -xf weaver.tar.xz
          echo "$PWD/weaver-x86_64-unknown-linux-gnu" >> $GITHUB_PATH

      - name: the seven metrics match this repository's registry
        run: |
          weaver registry check -r integration/weaver/registry
          weaver registry live-check -r integration/weaver/registry \
            --input-source samples.json --input-format json \
            --format json --output own-report --no-stream
          python3 scripts/check_weaver_report.py own-report

      # Three of the metric names belong to the example rather than to the GenAI
      # conventions, so the report is expected to carry advisories. The check
      # asserts what has to be recognised, and the README's conformance section
      # names every advisory that remains.
      - name: the GenAI conventions recognise the attributes
        run: |
          weaver registry live-check \
            -r 'https://github.com/open-telemetry/semantic-conventions-genai.git@aa3b7f4394245fec260013898049780975a407a4[model]' \
            --input-source samples.json --input-format json \
            --format json --output genai-report --no-stream || true
          python3 scripts/check_weaver_report.py genai-report --genai

  # The official W3C Trace Context suite drives a hop built on this library. A
  # context that survives one process must survive the next, and this is the program
  # that says whether it does.
  trace-context:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: the hop builds against this tree
        run: |
          moon work init
          moon work use . integration/trace-context
          moon build integration/trace-context/src --target native

      - name: the suite's own dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet aiohttp multidict

      - name: start the hop
        run: |
          moon run integration/trace-context/src --target native -- 8080 > hop.log 2>&1 &
          for i in $(seq 60); do
            if curl -sf -o /dev/null -X POST -H 'content-type: application/json' -d '[]' \
              http://127.0.0.1:8080/probe; then
              exit 0
            fi
            sleep 1
          done
          cat hop.log
          exit 1

      # STRICT_LEVEL 2 and SPEC_LEVEL 1 are the suite's defaults for a level 1
      # implementation, which is what W3C Trace Context asks of a hop.
      - name: run the suite
        run: |
          cd integration/trace-context/w3c
          SERVICE_ENDPOINT=http://127.0.0.1:8080 \
            ../../../.venv/bin/python3 test.py

      - name: the hop's log
        if: failure()
        run: cat hop.log || true
